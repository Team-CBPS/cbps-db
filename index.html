<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CBPS-DB</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 2em; 
            background: #181a1b; 
            color: #f5f5f5;
        }
        h1 { 
            text-align: center; 
            color: #fff; 
            cursor: pointer;
            transition: color 0.18s;
        }
        h1:hover { color: #ffd86c; }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 2em; 
            background: #23292d;
            color: #f5f5f5;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td { 
            border: 1px solid #35393b; 
            padding: 0.5em; 
            text-align: left; 
        }
        th { 
            background: #37404a; 
            color: #ffd86c;
        }
        tr:nth-child(even) { background: #23292d; }
        tr:nth-child(odd) { background: #202426; }
        .icon { width: 48px; height: 48px; object-fit: contain; background: #222; border-radius: 5px; }
        .download-btn { 
            background: #0976d7; 
            color: #fff; 
            padding: 0.3em 0.8em; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            text-decoration: none;
            font-weight: bold;
            transition: background 0.15s;
        }
        .download-btn:hover { background: #064785; color: #ffd86c; }
        a { color: #4eaaff; }
        a:hover { color: #ffd86c; }
        .src-open, .src-closed { font-weight: bold; }
        .src-open { color: #8cff8c; }
        .src-closed { color: #ff7c7c; }
        .footer-credits {
            position: fixed;
            right: 18px;
            bottom: 8px;
            font-size: 0.98em;
            color: #777;
            z-index: 9999;
            user-select: none;
        }
        .footer-credits a {
            color: #ffd86c;
            text-decoration: underline;
            font-weight: bold;
            transition: color 0.15s;
        }
        .footer-credits a:hover {
            color: #4eaaff;
        }
        .nav-menu {
            text-align: center;
            margin-bottom: 14px;
        }
        .nav-menu a {
            color: #ffd86c;
            text-decoration: underline;
            font-size: 1.08em;
            font-weight: bold;
            margin: 0 24px;
            transition: color 0.15s;
        }
        .nav-menu .active, .nav-menu a:hover {
            color: #4eaaff;
        }

        /* Adjust column widths */
#cbps-table th:nth-child(3), /* Author */
#cbps-table td:nth-child(3) {
    width: 35%;
}

#cbps-table th:nth-child(7), /* Source */
#cbps-table td:nth-child(7) {
    width: 9%;
}

    </style>
</head>
<body>
    <div class="nav-menu">
        <a href="https://team-cbps.github.io/cbps-db" class="active">Apps</a>
        <a href="plugins.html">Plugins</a>
        <a href="submit.html">Submit</a>
    </div>
    <h1 onclick="window.location.href='https://team-cbps.github.io/cbps-db/'">CBPS-DB</h1>
    <table id="cbps-table">
        <thead>
        <tr>
            <th>Icon</th>
            <th>Name</th>
            <th>Author</th>
            <th>Download</th>
            <th>DATA</th>
            <th>README</th>
            <th>Source</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <span class="footer-credits">
        &copy; 2025 <a href="https://github.com/SSMG4" target="_blank">SSMG4</a> & <a href="https://github.com/Team-CBPS" target="_blank">Team CBPS</a>. Made with <a href="https://github.com/copilot" target="_blank">GitHub Copilot</a>
    </span>
    <script>
        const CSV_URL = "https://raw.githubusercontent.com/Team-CBPS/cbps-db/refs/heads/gh-pages/cbpsdb.csv";

        function parseCSV(csv) {
            if (csv.charCodeAt(0) === 0xfeff) csv = csv.slice(1);
            const lines = csv.split(/\r?\n/).filter(l => l.trim().length > 0);
            const headers = lines[0].split(",");
            return lines.slice(1).map(line => {
                const values = [];
                let current = "";
                let inQuotes = false;
                for (let i = 0; i < line.length; ++i) {
                    const c = line[i];
                    if (c === '"') {
                        if (inQuotes && line[i+1] === '"') { current += '"'; ++i; }
                        else inQuotes = !inQuotes;
                    } else if (c === ',' && !inQuotes) {
                        values.push(current);
                        current = "";
                    } else {
                        current += c;
                    }
                }
                values.push(current);
                const obj = {};
                for (let j = 0; j < headers.length; ++j) {
                    obj[headers[j].trim()] = (values[j] || "").trim();
                }
                return obj;
            });
        }

        function createDownloadLink(url, name, label = "Download") {
            if (!url || url === "None") return '';
            return `<a class="download-btn" href="${url}" download="${encodeURIComponent(name)}.vpk">${label}</a>`;
        }

        function createReadmeLink(url) {
            if (!url || url === "None") return '';
            return `<a href="${url}" target="_blank">README</a>`;
        }

function createIcon(url, name) {
    if (!url || url === "None" || url.trim() === "") {
        return `<span style="color:#ff7c7c; font-weight:bold;">Missing Icon</span>`;
    } else {
        return `<img class="icon" src="${url}" alt="icon of ${name}" 
                     onerror="this.outerHTML='<span style=&quot;color:#ff7c7c;font-weight:bold;&quot;>Unreachable Icon</span>';">`;
    }
}

        function getSrcStatus(srcUrl) {
            if (srcUrl && srcUrl !== "None") {
                return `<a href="${srcUrl}" target="_blank" class="src-open">OPEN SRC</a>`;
            } else {
                return `<span class="src-closed">CLOSED SRC</span>`;
            }
        }

function isApp(row) {
    const t = (row["type"] || "").toUpperCase();
    // Only VPKs on this page
    if (t === "VPK") return true;
    return false;
}

        fetch(CSV_URL)
            .then(r => {
                if (!r.ok) throw new Error("Failed to fetch CSV");
                return r.text();
            })
            .then(csv => {
                const data = parseCSV(csv);
                const tbody = document.querySelector("#cbps-table tbody");
                tbody.innerHTML = "";
                data.forEach(row => {
                    if (row["visible"] && row["visible"].toLowerCase() !== "true") return;
                    if (!isApp(row)) return;

                    const dlUrl = row["download_url"] !== "None" && row["download_url"] ? row["download_url"] : (row["download_url_mirror"] !== "None" ? row["download_url_mirror"] : "");
                    const iconUrl = row["download_icon0"] !== "None" && row["download_icon0"] ? row["download_icon0"] : "";
                    const readmeUrl = row["download_readme"] !== "None" && row["download_readme"] ? row["download_readme"] : "";
                    const srcUrl = row["download_src"] !== "None" && row["download_src"] ? row["download_src"] : "";
                    const depends = row["depends"] && row["depends"] !== "None" ? row["depends"].trim() : "";

                    // 🔹 DATA button logic
                    let dataDownloadLink = '';
                    if (depends) {
                        const dataEntry = data.find(d => d["id"] === depends && (d["type"] || "").toUpperCase() === "DATA");
                        if (dataEntry) {
                            const dataUrl = dataEntry["download_url"] !== "None" && dataEntry["download_url"] ? dataEntry["download_url"] : 
                                            (dataEntry["download_url_mirror"] !== "None" ? dataEntry["download_url_mirror"] : "");
                            if (dataUrl) {
                                dataDownloadLink = createDownloadLink(dataUrl, dataEntry["title"] || "data", "DATA");
                            }
                        }
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${createIcon(iconUrl, row["title"] || "")}</td>
                        <td>${row["title"] || ""}</td>
                        <td>${row["credits"] || ""}</td>
                        <td>${createDownloadLink(dlUrl, row["title"] || "download")}</td>
                        <td>${dataDownloadLink}</td>
                        <td>${createReadmeLink(readmeUrl)}</td>
                        <td style="text-align:right;">${getSrcStatus(srcUrl)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                document.querySelector("#cbps-table tbody").innerHTML = `<tr><td colspan="7" style="color:red;">Error loading CBPS DB: ${err.message}</td></tr>`;
            });
    </script>
</body>
</html>
